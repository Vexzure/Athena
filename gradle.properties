## JVM Performance - Increased heap for faster builds
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m

## AndroidX
android.useAndroidX=true

## Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

## Android Build Optimizations
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
android.aapt2FromMavenOverride=/home/vexzure/Android/Sdk/build-tools/36.1.0/aapt2
android.buildToolsVersion=36.1.0

## Gradle Performance
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.vfs.watch=true
org.gradle.workers.max=4

## Java Toolchain
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

## KSP Optimizations
ksp.incremental=true
ksp.incremental.log=true

## R8 Full Mode (better optimization)
android.enableR8.fullMode=true