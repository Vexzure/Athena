name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.26.6
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.26.6
        with:
          category: "/language:java-kotlin"

  dependency-review:
    name: Dependency Review (PR Only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Dependency Review
        uses: actions/dependency-review-action@72eb03d02c7872a771aacd928f3123ac62ad6d3a # v4.3.3
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Scan dependencies for vulnerabilities
        run: |
          echo "=== Scanning Gradle Dependencies ==="
          ./gradlew dependencies --configuration releaseRuntimeClasspath > dependencies.txt

          echo "=== Dependency Tree Generated ==="
          echo "Checking for known vulnerable libraries..."

          # Check for common vulnerabilities
          VULNERABLE=0

          # Check for old versions with known CVEs
          if grep -q "com.squareup.okhttp3:okhttp:3\.[0-9]" dependencies.txt; then
            echo "⚠️  WARNING: Old OkHttp 3.x detected - upgrade to 4.x"
            VULNERABLE=1
          fi

          if grep -q "com.google.code.gson:gson:2\.[0-7]" dependencies.txt; then
            echo "⚠️  WARNING: Old Gson version detected - upgrade to 2.8+"
            VULNERABLE=1
          fi

          if grep -q "org.apache.logging.log4j:log4j-core:2\.[0-9]\." dependencies.txt; then
            echo "⚠️  WARNING: Potentially vulnerable Log4j version detected"
            VULNERABLE=1
          fi

          if [ $VULNERABLE -eq 0 ]; then
            echo "✅ No known vulnerable dependencies detected"
          else
            echo "⚠️  Vulnerable dependencies found - please review"
          fi

      - name: Upload dependency tree
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: dependency-tree
          path: dependencies.txt

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
