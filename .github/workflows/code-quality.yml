name: Code Quality Checks

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Ktlint & Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ktlint Check
        run: ./gradlew ktlintCheck
        continue-on-error: false

      - name: Detekt Analysis
        run: ./gradlew detekt
        continue-on-error: true

      - name: Upload Ktlint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            **/build/reports/ktlint/
          retention-days: 7

      - name: Upload Detekt Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            **/build/reports/detekt/
          retention-days: 7

      - name: Comment PR with Results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ❌ Code Quality Checks Failed\n\n' +
                    'Your code has ktlint or detekt issues. Please fix them before merging.\n\n' +
                    '**To fix:**\n' +
                    '- Run `./gradlew ktlintFormat` to auto-fix formatting\n' +
                    '- Run `./gradlew detekt` to see static analysis issues\n\n' +
                    'Check the workflow artifacts for detailed reports.'
            });

      - name: Fail if checks failed
        if: failure()
        run: |
          echo "::error::Code quality checks failed. Fix ktlint and detekt issues before merging."
          exit 1
